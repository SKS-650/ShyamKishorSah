<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Shyam</title>
  <meta name="description" content="Oops! This page doesn't exist." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/images/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/animations.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
  <script>(function(){const t=localStorage.getItem('portfolio-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');})()</script>

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-8);
      position: relative;
      overflow: hidden;
    }

    .error-page__code {
      font-family: var(--font-heading);
      font-size: clamp(6rem, 20vw, 14rem);
      font-weight: var(--fw-black);
      line-height: 1;
      background: var(--gradient-text-vivid);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: gradientShift 3s linear infinite, float 5s ease-in-out infinite;
      letter-spacing: var(--ls-tight);
      position: relative;
      z-index: 2;
    }

    .error-page__emoji {
      font-size: clamp(3rem, 8vw, 5rem);
      display: block;
      margin-bottom: var(--space-4);
      animation: float 4s ease-in-out infinite;
    }

    .error-page__title {
      font-size: var(--fs-3xl);
      font-family: var(--font-heading);
      font-weight: var(--fw-bold);
      margin-bottom: var(--space-4);
      color: var(--text-primary);
    }

    .error-page__desc {
      font-size: var(--fs-lg);
      color: var(--text-muted);
      max-width: 45ch;
      margin-inline: auto;
      line-height: var(--lh-relaxed);
      margin-bottom: var(--space-10);
    }

    .error-page__actions {
      display: flex;
      gap: var(--space-4);
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: var(--space-12);
    }

    .error-page__links {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      justify-content: center;
    }

    /* Decorative blobs */
    .error-page__glow-1 {
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37,99,235,0.15) 0%, transparent 70%);
      top: 10%; left: 20%;
      pointer-events: none;
      animation: blobFloat 14s ease-in-out infinite;
    }

    .error-page__glow-2 {
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,0.12) 0%, transparent 70%);
      bottom: 15%; right: 15%;
      pointer-events: none;
      animation: blobFloat 18s ease-in-out infinite reverse;
    }

    /* Countdown */
    .error-page__countdown {
      font-size: var(--fs-xs);
      color: var(--text-faint);
      letter-spacing: var(--ls-wide);
    }

    #countdown-num { color: var(--color-accent); font-weight: var(--fw-bold); }
  </style>
</head>
<body>

<div class="bg-blobs" aria-hidden="true">
  <div class="bg-blob bg-blob--1"></div>
  <div class="bg-blob bg-blob--2"></div>
</div>
<div class="bg-noise" aria-hidden="true"></div>

<!-- NAVBAR (minimal) -->
<header class="navbar scrolled" role="banner">
  <div class="navbar__inner">
    <a href="index.html" class="navbar__logo" aria-label="Shyam home">
      <div class="navbar__logo-mark">S</div>
      <span class="navbar__logo-text">Shyam</span>
    </a>
    <div class="navbar__actions">
      <button class="btn btn--ghost btn--icon" data-theme-toggle aria-label="Toggle theme">
        <i class="fa-solid fa-sun  theme-icon--light"></i>
        <i class="fa-solid fa-moon theme-icon--dark hidden"></i>
      </button>
    </div>
  </div>
</header>

<!-- Error Page Content -->
<main class="error-page" role="main" aria-label="404 error page">
  <div class="error-page__glow-1" aria-hidden="true"></div>
  <div class="error-page__glow-2" aria-hidden="true"></div>

  <span class="error-page__emoji" role="img" aria-label="Lost robot emoji">&#x1F916;</span>

  <div class="error-page__code" aria-hidden="true">404</div>

  <h1 class="error-page__title">
    Page Not Found
  </h1>

  <p class="error-page__desc">
    Oops! Looks like this page got lost in the neural network.
    The AI is searching, but it can't find what you're looking for. &#x1F9E0;
  </p>

  <div class="error-page__actions">
    <a href="index.html" class="btn btn--primary btn--lg magnetic">
      <i class="fa-solid fa-house" aria-hidden="true"></i> Back to Home
    </a>
    <a href="contact.html" class="btn btn--outline btn--lg">
      <i class="fa-solid fa-envelope" aria-hidden="true"></i> Report Issue
    </a>
  </div>

  <!-- Quick Nav Links -->
  <div class="error-page__links" role="navigation" aria-label="Quick links">
    <a href="projects.html"     class="tag tag--primary">&#x1F680; Projects</a>
    <a href="certificates.html" class="tag tag--secondary">&#x1F4DC; Certificates</a>
    <a href="experience.html"   class="tag tag--accent">&#x1F4BC; Experience</a>
    <a href="gallery.html"      class="tag">&#x1F5BC;&#xFE0F; Gallery</a>
  </div>

  <!-- Auto-redirect countdown -->
  <p class="error-page__countdown" style="margin-top:var(--space-10)">
    Redirecting to home in <span id="countdown-num">10</span>s
  </p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/gsap.min.js" crossorigin="anonymous"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/main.js"></script>
<script>
  // Auto-redirect countdown
  let count = 10;
  const el  = document.getElementById('countdown-num');
  const timer = setInterval(() => {
    count--;
    if (el) el.textContent = count;
    if (count <= 0) {
      clearInterval(timer);
      window.location.href = 'index.html';
    }
  }, 1000);

  // GSAP entrance
  window.addEventListener('load', () => {
    if (window.gsap) {
      gsap.from('.error-page__emoji',   { opacity:0, y:-30, duration:0.6, ease:'back.out(1.7)' });
      gsap.from('.error-page__code',    { opacity:0, scale:0.6, duration:0.8, ease:'back.out(1.4)', delay:0.2 });
      gsap.from('.error-page__title',   { opacity:0, y:20, duration:0.6, ease:'power3.out', delay:0.5 });
      gsap.from('.error-page__desc',    { opacity:0, y:20, duration:0.5, ease:'power2.out', delay:0.7 });
      gsap.from('.error-page__actions', { opacity:0, y:20, duration:0.5, ease:'power2.out', delay:0.9 });
      gsap.from('.error-page__links .tag', { opacity:0, scale:0.8, stagger:0.08, duration:0.4, ease:'back.out(1.4)', delay:1.1 });
    }
  });
</script>

</body>
</html>
