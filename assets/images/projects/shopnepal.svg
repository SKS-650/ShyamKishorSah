<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="ShopNepal — Online Shopping Application">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1030"/>
    </linearGradient>
    <!-- Purple accent gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#12101f;stop-opacity:0.95"/>
    </linearGradient>
    <!-- Green badge gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <!-- Cart icon gradient -->
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7c3aed" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#7c3aed" stroke-width="0.5">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Glow orbs -->
  <circle cx="150" cy="120" r="80" fill="#7c3aed" opacity="0.08"/>
  <circle cx="680" cy="340" r="100" fill="#2563eb" opacity="0.07"/>
  <circle cx="400" cy="225" r="140" fill="#7c3aed" opacity="0.04"/>

  <!-- ── NAVBAR BAR ── -->
  <rect x="60" y="40" width="680" height="40" rx="8" fill="url(#cardGrad)" stroke="#7c3aed" stroke-width="0.8" opacity="0.9"/>
  <!-- Logo text -->
  <circle cx="90" cy="60" r="12" fill="url(#purpleGrad)"/>
  <text x="90" y="65" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">S</text>
  <text x="110" y="65" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#a78bfa">ShopNepal</text>
  <!-- Nav items -->
  <text x="260" y="64" font-family="Arial,sans-serif" font-size="10" fill="#c4b5fd" opacity="0.8">Home</text>
  <text x="310" y="64" font-family="Arial,sans-serif" font-size="10" fill="#c4b5fd" opacity="0.8">Products</text>
  <text x="370" y="64" font-family="Arial,sans-serif" font-size="10" fill="#c4b5fd" opacity="0.8">Cart</text>
  <text x="410" y="64" font-family="Arial,sans-serif" font-size="10" fill="#c4b5fd" opacity="0.8">Wishlist</text>
  <text x="460" y="64" font-family="Arial,sans-serif" font-size="10" fill="#c4b5fd" opacity="0.8">Orders</text>
  <!-- Dark mode toggle -->
  <rect x="620" y="50" width="30" height="16" rx="8" fill="#374151"/>
  <circle cx="640" cy="58" r="6" fill="#7c3aed"/>
  <!-- Cart badge -->
  <rect x="660" y="48" width="36" height="20" rx="10" fill="url(#purpleGrad)" filter="url(#glow)"/>
  <text x="678" y="62" font-family="Arial,sans-serif" font-size="10" fill="white" text-anchor="middle">🛒 3</text>

  <!-- ── LEFT PANEL: Product Card ── -->
  <rect x="60" y="100" width="210" height="260" rx="12" fill="url(#cardGrad)" stroke="#7c3aed" stroke-width="0.8" filter="url(#softShadow)"/>
  <!-- Product image placeholder -->
  <rect x="70" y="110" width="190" height="130" rx="8" fill="#1e1b4b"/>
  <text x="165" y="168" font-family="Arial,sans-serif" font-size="36" text-anchor="middle">👟</text>
  <text x="165" y="195" font-family="Arial,sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Premium Sneakers</text>
  <!-- Wishlist heart -->
  <circle cx="245" cy="122" r="10" fill="#1e1b4b" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="245" y="126" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">♥</text>
  <!-- Product details -->
  <text x="80" y="262" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="white">Nike Air Max 2024</text>
  <text x="80" y="278" font-family="Arial,sans-serif" font-size="10" fill="#6b7280">Sports &amp; Footwear</text>
  <!-- Stars -->
  <text x="80" y="295" font-family="Arial,sans-serif" font-size="11" fill="#f59e0b">★★★★★</text>
  <text x="145" y="295" font-family="Arial,sans-serif" font-size="9" fill="#6b7280">(128)</text>
  <!-- Price -->
  <text x="80" y="316" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#a78bfa">Rs. 4,500</text>
  <text x="145" y="316" font-family="Arial,sans-serif" font-size="10" fill="#6b7280" text-decoration="line-through">Rs. 6,000</text>
  <!-- Discount badge -->
  <rect x="80" y="322" width="40" height="16" rx="8" fill="url(#greenGrad)"/>
  <text x="100" y="334" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">-25%</text>
  <!-- Add to cart button -->
  <rect x="80" y="344" width="175" height="28" rx="6" fill="url(#purpleGrad)" filter="url(#glow)"/>
  <text x="167" y="362" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">Add to Cart</text>

  <!-- ── CENTRE PANEL: Shopping Cart ── -->
  <rect x="285" y="100" width="250" height="260" rx="12" fill="url(#cardGrad)" stroke="#2563eb" stroke-width="0.8" filter="url(#softShadow)"/>
  <text x="305" y="124" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">🛒 Shopping Cart</text>
  <text x="490" y="124" font-family="Arial,sans-serif" font-size="9" fill="#6b7280" text-anchor="end">3 items</text>
  <line x1="295" y1="132" x2="525" y2="132" stroke="#374151" stroke-width="0.8"/>
  <!-- Cart item 1 -->
  <rect x="295" y="140" width="230" height="40" rx="6" fill="#1e1b4b"/>
  <text x="310" y="156" font-family="Arial,sans-serif" font-size="20">👟</text>
  <text x="340" y="156" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="white">Nike Air Max 2024</text>
  <text x="340" y="170" font-family="Arial,sans-serif" font-size="9" fill="#6b7280">Qty: 1</text>
  <text x="510" y="162" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#a78bfa" text-anchor="end">Rs. 4,500</text>
  <!-- Cart item 2 -->
  <rect x="295" y="186" width="230" height="40" rx="6" fill="#1e1b4b"/>
  <text x="310" y="202" font-family="Arial,sans-serif" font-size="20">👕</text>
  <text x="340" y="202" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="white">Cotton T-Shirt (L)</text>
  <text x="340" y="216" font-family="Arial,sans-serif" font-size="9" fill="#6b7280">Qty: 2</text>
  <text x="510" y="208" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#a78bfa" text-anchor="end">Rs. 1,600</text>
  <!-- Cart item 3 -->
  <rect x="295" y="232" width="230" height="40" rx="6" fill="#1e1b4b"/>
  <text x="310" y="248" font-family="Arial,sans-serif" font-size="20">📱</text>
  <text x="340" y="248" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="white">Phone Case Pro</text>
  <text x="340" y="262" font-family="Arial,sans-serif" font-size="9" fill="#6b7280">Qty: 1</text>
  <text x="510" y="254" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#a78bfa" text-anchor="end">Rs. 850</text>
  <!-- Coupon input -->
  <rect x="295" y="280" width="150" height="24" rx="6" fill="#12101f" stroke="#374151" stroke-width="0.8"/>
  <text x="305" y="296" font-family="Arial,sans-serif" font-size="9" fill="#9ca3af">Coupon: SAVE20</text>
  <rect x="452" y="280" width="73" height="24" rx="6" fill="url(#greenGrad)"/>
  <text x="488" y="296" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">Applied ✓</text>
  <!-- Divider -->
  <line x1="295" y1="312" x2="525" y2="312" stroke="#374151" stroke-width="0.8"/>
  <!-- Totals -->
  <text x="305" y="326" font-family="Arial,sans-serif" font-size="9" fill="#9ca3af">Subtotal:</text>
  <text x="515" y="326" font-family="Arial,sans-serif" font-size="9" fill="#9ca3af" text-anchor="end">Rs. 6,950</text>
  <text x="305" y="338" font-family="Arial,sans-serif" font-size="9" fill="#10b981">Discount (SAVE20):</text>
  <text x="515" y="338" font-family="Arial,sans-serif" font-size="9" fill="#10b981" text-anchor="end">- Rs. 1,390</text>
  <text x="305" y="352" font-family="Arial,sans-serif" font-size="11" font-weight="800" fill="white">Total:</text>
  <text x="515" y="352" font-family="Arial,sans-serif" font-size="11" font-weight="800" fill="#a78bfa" text-anchor="end">Rs. 5,560</text>

  <!-- ── RIGHT PANEL: Payment + Dashboard ── -->
  <rect x="550" y="100" width="190" height="120" rx="12" fill="url(#cardGrad)" stroke="#059669" stroke-width="0.8"/>
  <text x="565" y="122" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="white">💳 Payment</text>
  <!-- eSewa button -->
  <rect x="565" y="130" width="160" height="22" rx="6" fill="#059669"/>
  <text x="645" y="145" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">eSewa</text>
  <!-- PhonePe button -->
  <rect x="565" y="158" width="160" height="22" rx="6" fill="#5b21b6"/>
  <text x="645" y="173" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">PhonePe</text>
  <!-- COD button -->
  <rect x="565" y="186" width="160" height="22" rx="6" fill="#374151" stroke="#6b7280" stroke-width="0.5"/>
  <text x="645" y="201" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#d1d5db" text-anchor="middle">Cash on Delivery</text>

  <!-- Admin Dashboard mini -->
  <rect x="550" y="230" width="190" height="130" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="565" y="252" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="white">📊 Dashboard</text>
  <!-- Mini stat cards -->
  <rect x="563" y="260" width="80" height="38" rx="6" fill="#1e1b4b"/>
  <text x="603" y="274" font-family="Arial,sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">Total Orders</text>
  <text x="603" y="290" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#a78bfa" text-anchor="middle">1,247</text>
  <rect x="651" y="260" width="80" height="38" rx="6" fill="#1e1b4b"/>
  <text x="691" y="274" font-family="Arial,sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">Revenue</text>
  <text x="691" y="290" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#10b981" text-anchor="middle">Rs.98k</text>
  <!-- Mini chart bars -->
  <rect x="563" y="308" width="8" height="30" rx="2" fill="#7c3aed" opacity="0.4"/>
  <rect x="576" y="318" width="8" height="20" rx="2" fill="#7c3aed" opacity="0.5"/>
  <rect x="589" y="306" width="8" height="32" rx="2" fill="#7c3aed" opacity="0.6"/>
  <rect x="602" y="300" width="8" height="38" rx="2" fill="#7c3aed" opacity="0.8"/>
  <rect x="615" y="310" width="8" height="28" rx="2" fill="#7c3aed" opacity="0.6"/>
  <rect x="628" y="295" width="8" height="43" rx="2" fill="#a78bfa"/>
  <rect x="641" y="305" width="8" height="33" rx="2" fill="#7c3aed" opacity="0.7"/>
  <rect x="654" y="290" width="8" height="48" rx="2" fill="#a78bfa" filter="url(#glow)"/>
  <text x="565" y="354" font-family="Arial,sans-serif" font-size="8" fill="#6b7280">7-day sales trend</text>

  <!-- ── BOTTOM: Tech stack badges ── -->
  <rect x="60" y="376" width="680" height="38" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="0.5" opacity="0.9"/>
  <!-- Tech badges -->
  <rect x="80" y="386" width="68" height="18" rx="9" fill="#1e3a5f"/>
  <text x="114" y="398" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#60a5fa" text-anchor="middle">Django 5.2+</text>
  <rect x="156" y="386" width="58" height="18" rx="9" fill="#1a1f2e"/>
  <text x="185" y="398" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#c4b5fd" text-anchor="middle">Bootstrap 5</text>
  <rect x="222" y="386" width="52" height="18" rx="9" fill="#1a2e1a"/>
  <text x="248" y="398" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#86efac" text-anchor="middle">eSewa API</text>
  <rect x="282" y="386" width="58" height="18" rx="9" fill="#1f1a2e"/>
  <text x="311" y="398" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#c4b5fd" text-anchor="middle">PhonePe API</text>
  <rect x="348" y="386" width="52" height="18" rx="9" fill="#2e1a1a"/>
  <text x="374" y="398" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#fca5a5" text-anchor="middle">Chart.js</text>
  <rect x="408" y="386" width="50" height="18" rx="9" fill="#1f2a1a"/>
  <text x="433" y="398" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#86efac" text-anchor="middle">SQLite3</text>
  <rect x="466" y="386" width="68" height="18" rx="9" fill="#1a1f2e"/>
  <text x="500" y="398" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#93c5fd" text-anchor="middle">Python 3.11+</text>
  <rect x="542" y="386" width="68" height="18" rx="9" fill="#2e1a2e"/>
  <text x="576" y="398" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#e879f9" text-anchor="middle">django-allauth</text>
  <!-- Status badge -->
  <rect x="634" y="385" width="96" height="20" rx="10" fill="url(#greenGrad)" filter="url(#glow)"/>
  <text x="682" y="398" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">✅ Production Ready</text>
</svg>
